<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460">
<defs>
 <radialGradient id="abg"><stop stop-color="#08242a"/><stop offset="1" stop-color="#020605"/></radialGradient>
 <linearGradient id="cyan"><stop stop-color="#00f0ff"/><stop offset=".5" stop-color="#b4ffff"/><stop offset="1" stop-color="#0077ff"/></linearGradient>
 <linearGradient id="green"><stop stop-color="#00ff73"/><stop offset=".5" stop-color="#c4ff54"/><stop offset="1" stop-color="#00a987"/></linearGradient>
 <filter id="ag"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="460" rx="26" fill="url(#abg)"/>
<g fill="#c4fff6" opacity=".55"><circle cx="95" cy="78" r="2"/><circle cx="170" cy="350" r="2"/><circle cx="830" cy="85" r="2"/><circle cx="905" cy="335" r="2"/><circle cx="690" cy="45" r="1.5"/><circle cx="330" cy="405" r="1.5"/></g>
<g transform="translate(500 230)" fill="none" stroke-width="4" filter="url(#ag)">
 <ellipse rx="300" ry="112" stroke="url(#cyan)"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="300" ry="112" stroke="url(#green)" transform="rotate(60)"><animateTransform attributeName="transform" type="rotate" values="60;420" dur="21s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="300" ry="112" stroke="#9b7bff" transform="rotate(120)"><animateTransform attributeName="transform" type="rotate" values="120;480" dur="26s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="245" ry="88" stroke="#e4ffff" stroke-width="2" opacity=".65"/>
 <circle r="25" fill="#00dfff" stroke="#d9ffff" stroke-width="3"><animate attributeName="r" values="20;29;20" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle r="10" fill="#ffffff" stroke="none"/>
 <circle cx="300" cy="0" r="10" fill="#00f6ff" stroke="none"><animateMotion dur="5s" repeatCount="indefinite" path="M0 0 A300 112 0 1 1 0 0"/></circle>
 <circle cx="-150" cy="-56" r="9" fill="#b4ff3b" stroke="none"><animate attributeName="cx" values="-150;150;-150" dur="4s" repeatCount="indefinite"/></circle>
</g>
<text x="500" y="430" fill="#8affd5" font-family="monospace" font-size="17" text-anchor="middle" letter-spacing="7">ATOMIC ORBIT • IN MOTION</text>
</svg>